<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParentBridge</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; height: 100vh; font: 22px/1.4 system-ui, sans-serif; background: #eef0f3; color: #1a1a1a; }

  /* Meeting: French left, English right. Two white panels sit behind a shared caption grid,
     so each turn's French and English line up on the same row. */
  #meeting { height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(0, 1fr) auto; column-gap: 12px; padding: 12px; }
  .panel { grid-row: 1 / -1; background: #fff; border-radius: 24px; transition: box-shadow .2s; }
  .panel.fr, h2.fr, .controls.fr { grid-column: 1; }
  .panel.en, h2.en, .controls.en { grid-column: 2; }
  .panel.speaking { box-shadow: 0 0 0 4px #7c5cff, 0 0 48px 8px #7c5cff88; } /* later: animated Siri-style glow */
  h2 { grid-row: 1; margin: 0; padding: 24px 24px 12px; font-size: 16px; text-transform: uppercase; letter-spacing: .1em; color: #888; }
  h2.en { text-align: right; }

  .captions { grid-column: 1 / -1; grid-row: 2; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; align-content: start; }
  .cap { padding: 0 24px 20px; }
  .cap .label { display: block; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #888; }
  .cap p { margin: 2px 0 0; }
  .cap.other p { color: #555; }

  .controls { grid-row: 3; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 24px 24px; }
  .status { min-height: 1.4em; font-size: 18px; color: #888; text-align: center; }
  .status.error { color: #c0392b; }
  .mic { width: 128px; height: 128px; border-radius: 50%; border: 0; background: #1a1a1a; color: #fff; font-size: 52px; cursor: pointer; touch-action: manipulation; }
  .mic[aria-pressed="true"] { background: #7c5cff; }
  .mic:disabled { opacity: .35; cursor: default; }
  #end { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border: 0; border-radius: 999px; background: #c0392b; color: #fff; font-size: 18px; cursor: pointer; }
  #end:disabled { opacity: .5; }

  /* Summary */
  #summary { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  #summary .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  #summary h2 { padding: 0; }
  table { width: 100%; border-collapse: collapse; margin: 32px 0; background: #fff; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
  #new { padding: 12px 24px; border: 0; border-radius: 999px; background: #1a1a1a; color: #fff; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>

<main id="meeting">
  <div class="panel fr"></div>
  <div class="panel en"></div>
  <h2 class="fr" lang="fr">Français</h2>
  <h2 class="en">English</h2>
  <div class="captions"></div>
  <div class="controls fr" lang="fr">
    <div class="status"></div>
    <button class="mic" data-speaker="parent" aria-pressed="false" aria-label="Touchez pour parler (parent, français)">🎤</button>
  </div>
  <div class="controls en">
    <div class="status"></div>
    <button class="mic" data-speaker="teacher" aria-pressed="false" aria-label="Tap to speak (teacher, English)">🎤</button>
  </div>
</main>
<button id="end">End meeting</button>

<section id="summary" hidden>
  <div class="cols">
    <div lang="en"><h2>Summary</h2><p id="sum-en"></p></div>
    <div lang="fr"><h2>Résumé</h2><p id="sum-fr"></p></div>
  </div>
  <table>
    <thead><tr><th>Owner</th><th>Task EN</th><th>Tâche FR</th><th>Due</th></tr></thead>
    <tbody id="items"></tbody>
  </table>
  <button id="new">New meeting</button>
</section>

<script>
const params = new URLSearchParams(location.search);
const MOCK = params.has('mock');

const LANG = { parent: 'fr', teacher: 'en' };
const ROLE = {
  fr: { parent: 'Parent', teacher: 'Enseignant', translated: 'traduction' },
  en: { parent: 'Parent', teacher: 'Teacher', translated: 'translation' },
};
const transcript = []; // turns without audio_b64; doubles as history for /api/turn
const mimeType = window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
  ? 'audio/webm;codecs=opus' : 'audio/mp4';
let stream = null, recorder = null, chunks = [], startedAt = 0, active = null;

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function setStatus(lang, text, isError = false) {
  const el = $(`.controls.${lang} .status`);
  el.textContent = text;
  el.classList.toggle('error', isError);
}

function setBusy(busy) {
  document.querySelectorAll('.mic, #end').forEach(b => b.disabled = busy);
}

// Ask for the mic once, on page load.
navigator.mediaDevices.getUserMedia({ audio: true })
  .then(s => stream = s)
  .catch(() => { if (!MOCK) ['fr', 'en'].forEach(l => setStatus(l, 'Microphone blocked', true)); });

// --- Recording (tap to start, tap again to stop) ---

function setRecording(speaker, on) {
  const lang = LANG[speaker];
  $(`.panel.${lang}`).classList.toggle('speaking', on);
  const btn = $(`.mic[data-speaker="${speaker}"]`);
  btn.setAttribute('aria-pressed', on);
  btn.textContent = on ? '⏹' : '🎤';
  // The other mic stays off while one side is talking.
  document.querySelectorAll('.mic').forEach(b => { if (b !== btn) b.disabled = on; });
  $('#end').disabled = on;
  setStatus(lang, on ? (lang === 'fr' ? 'Écoute en cours… touchez pour arrêter' : 'Listening… tap to stop') : '');
}

function start(speaker) {
  const lang = LANG[speaker];
  if (!stream && !MOCK) return setStatus(lang, 'Microphone not available', true);
  active = speaker;
  startedAt = performance.now();
  setRecording(speaker, true);
  if (stream) {
    chunks = [];
    recorder = new MediaRecorder(stream, { mimeType });
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.start();
  }
}

function stop() {
  const speaker = active;
  active = null;
  setRecording(speaker, false);
  const rec = recorder;
  recorder = null;
  if (performance.now() - startedAt < 500) { rec?.stop(); return; } // ignore accidental taps
  setBusy(true); // lock the mics now; the recorder's onstop fires a moment later
  if (!rec) return sendTurn(null, speaker); // mock without a mic
  rec.onstop = () => sendTurn(new Blob(chunks, { type: mimeType }), speaker);
  rec.stop();
}

document.querySelectorAll('.mic').forEach(btn => btn.onclick = () => {
  if (active === btn.dataset.speaker) stop();
  else if (!active) start(btn.dataset.speaker);
});

// --- Turns ---

async function request(url, options) {
  const res = await fetch(url, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Server error (${res.status})`);
  return data;
}

function postTurn(blob, speaker) {
  const form = new FormData();
  form.append('audio', blob, mimeType.startsWith('audio/webm') ? 'turn.webm' : 'turn.mp4');
  form.append('speaker', speaker);
  form.append('history', JSON.stringify(transcript.slice(-6)));
  return request('/api/turn', { method: 'POST', body: form });
}

async function sendTurn(blob, speaker) {
  const lang = LANG[speaker];
  setBusy(true);
  setStatus(lang, lang === 'fr' ? 'Traduction…' : 'Translating…');
  try {
    const { audio_b64, ...turn } = MOCK ? await mockTurn(speaker) : await postTurn(blob, speaker);
    transcript.push(turn);
    renderTurn(turn); // caption first, then audio
    setStatus(lang, '');
    if (audio_b64) new Audio('data:audio/mpeg;base64,' + audio_b64).play().catch(() => {});
    else speak(turn.target_text, turn.target_lang);
  } catch (e) {
    setStatus(lang, e.message, true);
  } finally {
    setBusy(false);
  }
}

// TEMP: browser Web Speech TTS when a turn has no audio (mock mode). Remove once ElevenLabs audio comes back.
function speak(text, lang) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'fr' ? 'fr-FR' : 'en-US';
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// One row per turn: French cell then English cell, so the grid keeps them aligned.
function renderTurn(turn) {
  let last;
  for (const lang of ['fr', 'en']) {
    const own = lang === turn.source_lang;
    const cell = document.createElement('div');
    cell.className = 'cap ' + (own ? 'own' : 'other');
    cell.lang = lang;
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = ROLE[lang][turn.speaker] + (own ? '' : ' · ' + ROLE[lang].translated);
    const p = document.createElement('p');
    p.textContent = own ? turn.source_text : turn.target_text;
    cell.append(label, p);
    $('.captions').append(cell);
    last = cell;
  }
  last.scrollIntoView({ block: 'end', behavior: 'smooth' });
}

// --- Summary ---

$('#end').onclick = async () => {
  setBusy(true);
  try {
    const s = MOCK ? (await sleep(600), MOCK_SUMMARY) : await request('/api/summary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript }),
    });
    $('#sum-en').textContent = s.summary_en;
    $('#sum-fr').textContent = s.summary_fr;
    for (const item of s.action_items) {
      const row = $('#items').insertRow();
      for (const key of ['owner', 'task_en', 'task_fr', 'due']) row.insertCell().textContent = item[key];
    }
    stream?.getTracks().forEach(t => t.stop());
    $('#meeting').hidden = true;
    $('#end').hidden = true;
    $('#summary').hidden = false;
  } catch (e) {
    setStatus('en', e.message, true);
    setBusy(false);
  }
};
$('#new').onclick = () => location.reload();

// --- Mock mode (?mock=1): demo-script responses, no backend ---

const MOCK_LINES = {
  teacher: [
    ["Léo is doing well in reading, but he's below benchmark in math.",
     "Léo progresse bien en lecture, mais il est en dessous du niveau attendu en mathématiques."],
    ["We'd like to start math support twice a week beginning March 3, and we can discuss an IEP evaluation.",
     "Nous aimerions commencer un soutien en mathématiques deux fois par semaine à partir du 3 mars, et nous pouvons discuter d'une évaluation pour un plan d'éducation individualisé (IEP)."],
    ["Please sign the consent form by Friday.",
     "Veuillez signer le formulaire de consentement d'ici vendredi."],
  ],
  parent: [
    ["Qu'est-ce que ça veut dire, en dessous du niveau ? Est-ce qu'il a besoin d'aide ?",
     "What does below level mean? Does he need help?"],
    ["D'accord. Qu'est-ce que je dois faire de mon côté ?",
     "Okay. What do I need to do on my end?"],
  ],
};
const mockCount = { teacher: 0, parent: 0 };

async function mockTurn(speaker) {
  await sleep(600);
  const lines = MOCK_LINES[speaker];
  const [source_text, target_text] = lines[mockCount[speaker]++ % lines.length];
  const source_lang = LANG[speaker];
  return { speaker, source_lang, target_lang: source_lang === 'fr' ? 'en' : 'fr', source_text, target_text, audio_b64: '' };
}

const MOCK_SUMMARY = {
  summary_en: "Léo is doing well in reading but is below benchmark in math. The school will start math support twice a week beginning March 3 and discuss an IEP evaluation. The parent will sign the consent form by Friday.",
  summary_fr: "Léo progresse bien en lecture, mais il est en dessous du niveau attendu en mathématiques. L'école commencera un soutien en mathématiques deux fois par semaine à partir du 3 mars et discutera d'une évaluation pour un IEP. Vous signerez le formulaire de consentement d'ici vendredi.",
  action_items: [
    { owner: 'Teacher', task_en: 'Start math support twice a week', task_fr: 'Commencer le soutien en mathématiques deux fois par semaine', due: 'March 3' },
    { owner: 'Teacher', task_en: 'Discuss an IEP evaluation', task_fr: "Discuter d'une évaluation pour un IEP", due: '' },
    { owner: 'Parent', task_en: 'Sign the consent form', task_fr: 'Signer le formulaire de consentement', due: 'Friday' },
  ],
};
</script>
</body>
</html>
